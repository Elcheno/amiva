spring.application.name=amiva-backend

# Secretos desde el .env de la raíz (arrancando desde backend/ o desde la raíz)
spring.config.import=optional:file:../.env[.properties],optional:file:.env[.properties]

# Base core: JPA (@Primary)
amiva.datasource.core.url=${AMIVA_CORE_DB_URL:jdbc:postgresql://localhost:5432/amiva_core}
amiva.datasource.core.username=${AMIVA_CORE_DB_USER:amiva_core}
amiva.datasource.core.password=${AMIVA_CORE_DB_PASSWORD}
amiva.datasource.core.driver-class-name=org.postgresql.Driver

# Base data: submissions y respuestas (JDBC)
amiva.datasource.data.url=${AMIVA_DATA_DB_URL:jdbc:postgresql://localhost:5433/amiva_data}
amiva.datasource.data.username=${AMIVA_DATA_DB_USER:amiva_data}
amiva.datasource.data.password=${AMIVA_DATA_DB_PASSWORD}
amiva.datasource.data.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

# Flyway se configura a mano en FlywayConfig (una instancia por base)
spring.flyway.enabled=false

# Health público solo con estado por componente, sin detalles
management.endpoint.health.show-components=always
